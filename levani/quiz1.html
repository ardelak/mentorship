<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Formative Quiz — Lessons 1–7</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #17223b;
        --ink-soft: #4b5670;
        --paper: #f3f1e7;
        --card: #ffffff;
        --amber: #b8791c;
        --amber-deep: #8f5d12;
        --amber-wash: #f1e1be;
        --rule: #d8d1bc;
        --green: #3f7a56;
        --green-wash: #e1eee6;
        --danger: #9c3b2e;
        --danger-wash: #f5e1dc;
        --shadow: 0 1px 2px rgba(23, 34, 59, 0.06), 0 6px 20px rgba(23, 34, 59, 0.07);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--paper);
        background-image: radial-gradient(circle at 1px 1px, rgba(23, 34, 59, 0.05) 1px, transparent 0);
        background-size: 22px 22px;
        color: var(--ink);
        font-family: "Karla", sans-serif;
        font-size: 16.5px;
        line-height: 1.7;
      }
      h1, h2, h3, h4 {
        margin: 0;
        font-family: "Newsreader", serif;
        color: var(--ink);
      }
      a { color: var(--amber-deep); }
      ::selection { background: var(--amber-wash); }

      .topnav {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(243, 241, 231, 0.92);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--rule);
        padding: 0.7rem 1.25rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.8rem;
      }
      .brand {
        font-family: "Newsreader", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 1.05rem;
      }
      .links { display: flex; gap: 0.35rem; flex-wrap: wrap; }
      .pill {
        font-size: 0.82rem;
        color: var(--ink-soft);
        text-decoration: none;
        padding: 0.3rem 0.7rem;
        border-radius: 999px;
        border: 1px solid transparent;
      }
      .pill:hover { border-color: var(--rule); background: var(--card); color: var(--ink); }

      .wrap { max-width: 920px; margin: 0 auto; padding: 0 1.5rem 6rem; }
      .hero { padding: 3.5rem 0 2.2rem; text-align: center; }
      .stamp {
        width: 120px;
        height: 120px;
        margin: 0 auto 1.5rem;
        border: 2px dashed var(--amber);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: rotate(-6deg);
        color: var(--amber-deep);
        font-family: "JetBrains Mono", monospace;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        text-align: center;
        line-height: 1.35;
      }
      .hero h1 {
        font-size: clamp(2.3rem, 4vw, 3.6rem);
        font-style: italic;
        font-weight: 500;
        line-height: 1.1;
        max-width: 760px;
        margin: 0 auto 0.7rem;
      }
      .for-line { color: var(--ink-soft); font-size: 1.08rem; margin: 0; }
      .chips {
        margin-top: 1.2rem;
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .chip {
        font-size: 0.8rem;
        font-family: "JetBrains Mono", monospace;
        background: var(--card);
        border: 1px solid var(--rule);
        padding: 0.32rem 0.75rem;
        border-radius: 999px;
        color: var(--ink-soft);
      }

      .objective, .summary-box {
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: var(--radius-md);
        padding: 1.5rem 1.75rem;
        margin: 2rem 0;
        box-shadow: var(--shadow);
      }
      .objective h2 { font-size: 1.25rem; margin-bottom: 0.5rem; }
      .objective p { color: var(--ink-soft); margin: 0; }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(150px, 1fr));
        gap: 0.9rem;
        margin-top: 1.1rem;
      }
      .metric {
        background: #fff;
        border: 1px solid var(--rule);
        border-radius: 12px;
        padding: 0.8rem 0.9rem;
      }
      .metric-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.7rem;
        color: var(--ink-soft);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .metric-value {
        font-size: 1.3rem;
        font-weight: 700;
        margin-top: 0.25rem;
      }

      .progress-shell {
        margin-top: 1rem;
        height: 12px;
        background: #f0ebdf;
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid var(--rule);
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--amber), var(--amber-deep));
        transition: width 0.25s ease;
      }

      .trail { position: relative; padding-left: 2.5rem; }
      .trail::before {
        content: "";
        position: absolute;
        left: 1.05rem;
        top: 0.4rem;
        bottom: 0.4rem;
        width: 2px;
        background-image: linear-gradient(var(--rule) 60%, transparent 0%);
        background-size: 2px 10px;
        background-repeat: repeat-y;
      }
      .waypoint {
        position: relative;
        margin-bottom: 2.4rem;
        padding: 1rem 0 0.25rem;
      }
      .stamp-num {
        position: absolute;
        left: -2.6rem;
        top: 0.25rem;
        width: 2.2rem;
        height: 2.2rem;
        border-radius: 50%;
        background: var(--ink);
        color: var(--paper);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.95rem;
        font-weight: 600;
      }
      .question-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.8rem;
        margin-bottom: 0.9rem;
      }
      .question-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.76rem;
        color: var(--amber-deep);
        background: var(--amber-wash);
        border-radius: 999px;
        padding: 0.25rem 0.55rem;
      }
      .question-text {
        font-size: 1.05rem;
        margin: 0 0 0.9rem;
        line-height: 1.6;
      }
      .code-block {
        display: block;
        margin: 0.75rem 0 1rem;
        background: var(--vs-bg);
        color: var(--vs-text);
        border-radius: var(--radius-md);
        padding: 1rem 1.1rem;
        overflow-x: auto;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.86rem;
        line-height: 1.65;
        border: 1px solid rgba(0,0,0,0.08);
      }
      .options {
        display: grid;
        gap: 0.6rem;
      }
      .option-btn, .check-btn, .ghost-btn {
        appearance: none;
        border: 1px solid var(--rule);
        background: var(--card);
        color: var(--ink);
        border-radius: 10px;
        padding: 0.72rem 0.9rem;
        text-align: left;
        font: inherit;
        cursor: pointer;
        transition: 0.15s ease;
      }
      .option-btn:hover, .check-btn:hover, .ghost-btn:hover {
        border-color: var(--amber);
        background: var(--amber-wash);
      }
      .option-btn.correct {
        background: var(--green-wash);
        border-color: var(--green);
        color: var(--green);
        font-weight: 700;
      }
      .option-btn.wrong {
        background: var(--danger-wash);
        border-color: var(--danger);
        color: var(--danger);
        text-decoration: line-through;
      }
      .option-btn.selected {
        border-color: var(--amber);
        background: #fffaf1;
      }
      .option-btn:disabled { cursor: default; opacity: 1; }

      .input-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
        margin-top: 0.5rem;
      }
      input[type="text"] {
        flex: 1 1 280px;
        border: 1px solid var(--rule);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        padding: 0.8rem 0.9rem;
        font: inherit;
      }
      .check-btn {
        background: var(--ink);
        color: var(--paper);
        border-color: var(--ink);
        min-width: 110px;
        text-align: center;
      }
      .check-btn:hover { opacity: 0.94; }
      .feedback {
        margin-top: 0.8rem;
        padding: 0.7rem 0.9rem;
        border-radius: 10px;
        font-weight: 700;
        display: none;
      }
      .feedback.correct {
        display: block;
        background: var(--green-wash);
        color: var(--green);
        border: 1px solid #b9d8c5;
      }
      .feedback.wrong {
        display: block;
        background: var(--danger-wash);
        color: var(--danger);
        border: 1px solid #e3b6ac;
      }

      details {
        margin-top: 0.8rem;
        border: 1px solid var(--rule);
        border-radius: 10px;
        background: #fff;
      }
      summary {
        list-style: none;
        cursor: pointer;
        padding: 0.75rem 1rem;
        font-weight: 700;
        color: var(--ink-soft);
      }
      summary::-webkit-details-marker { display: none; }
      details[open] summary {
        border-bottom: 1px solid var(--rule);
        color: var(--ink);
      }
      .answer-box {
        padding: 0.9rem 1rem 1rem;
        color: var(--ink-soft);
      }
      .answer-box strong { color: var(--ink); }

      .summary-box {
        position: sticky;
        bottom: 1rem;
        z-index: 25;
      }
      .score-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }
      #score {
        font-family: "JetBrains Mono", monospace;
        font-size: 1.1rem;
        font-weight: 700;
      }
      .actions {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
      }
      .ghost-btn {
        background: transparent;
      }

      @media (max-width: 640px) {
        .trail { padding-left: 1.9rem; }
        .stamp-num { left: -2rem; width: 1.8rem; height: 1.8rem; font-size: 0.8rem; }
        .summary-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <nav class="topnav">
      <div class="brand">Advanced Quiz</div>
      <div class="links">
        <a class="pill" href="#overview">Overview</a>
        <a class="pill" href="#questions">Questions</a>
        <a class="pill" href="#scoreboard">Score</a>
      </div>
    </nav>

    <div class="wrap">
      <section class="hero" id="overview">
        <div class="stamp">ADV<br />QUIZ</div>
        <h1>Lessons 1–7 Final Checkpoint</h1>
        <p class="for-line">A more advanced recap of Python, API work, and Telegram bots.</p>
        <div class="chips">
          <span class="chip">24 questions</span>
          <span class="chip">MCQ + free response</span>
          <span class="chip">Auto-scoring</span>
        </div>
      </section>

      <div class="objective">
        <h2>Progress overview</h2>
        <div class="summary-grid">
          <div class="metric">
            <div class="metric-label">Answered</div>
            <div class="metric-value" id="answeredCount">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">Correct</div>
            <div class="metric-value" id="correctCount">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">Percent</div>
            <div class="metric-value" id="percentCount">0%</div>
          </div>
        </div>
        <div class="progress-shell">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>

      <div class="trail" id="questions"></div>

      <div class="summary-box" id="scoreboard">
        <div class="score-row">
          <div id="score">Score: 0 / 24</div>
          <div class="actions">
            <button class="ghost-btn" id="showAll">Reveal all answers</button>
            <button class="ghost-btn" id="resetQuiz">Reset quiz</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const questions = [
        {
          type: "mcq",
          lesson: "Lesson 1",
          prompt: "Why do developers use VS Code in this course instead of a plain text editor?",
          options: [
            "It only works online",
            "It helps write, organize, and run code in one environment",
            "It replaces Python",
            "It automatically solves every bug"
          ],
          answerIndex: 1,
          explanation: "VS Code gives a structured environment for editing files and launching the terminal, which is exactly what students need while learning Python."
        },
        {
          type: "mcq",
          lesson: "Lesson 1",
          prompt: "What does pwd do in the terminal?",
          options: ["Print a Python file", "Print the current working directory", "Create a new folder", "Run a function"],
          answerIndex: 1,
          explanation: "pwd prints the current working directory, helping you know where you are in the filesystem."
        },
        {
          type: "mcq",
          lesson: "Lesson 1",
          prompt: "What is the most important reason to use input() in a script?",
          options: [
            "To read a file from disk",
            "To accept user text while the program is running",
            "To define a variable",
            "To open a browser"
          ],
          answerIndex: 1,
          explanation: "input() lets the program interact with the user by receiving data at runtime."
        },
        {
          type: "free",
          lesson: "Lesson 1",
          prompt: "Write the exact command to run a Python file named app.py from the terminal.",
          answer: "python app.py",
          accepted: ["python app.py", "python3 app.py"],
          explanation: "Most systems use python app.py, while some use python3 app.py depending on the installation."
        },
        {
          type: "mcq",
          lesson: "Lesson 2",
          prompt: "Why do we use if statements?",
          options: [
            "To repeat code many times",
            "To check a condition before running code",
            "To create variables",
            "To install packages"
          ],
          answerIndex: 1,
          explanation: "if statements allow code to run only when a specific condition is true."
        },
        {
          type: "mcq",
          lesson: "Lesson 2",
          prompt: "Which of these is a loop structure?",
          options: ["if", "for", "return", "input"],
          answerIndex: 1,
          explanation: "for repeats an action multiple times, which is the defining feature of a loop."
        },
        {
          type: "mcq",
          lesson: "Lesson 2",
          prompt: "What is the main advantage of a function?",
          options: [
            "It makes every file shorter",
            "It groups repeatable logic in one place",
            "It prevents all errors",
            "It deletes variables"
          ],
          answerIndex: 1,
          explanation: "Functions make code reusable and easier to maintain by isolating repeatable logic."
        },
        {
          type: "free",
          lesson: "Lesson 2",
          prompt: "Complete this function header: def ___(name):",
          answer: "greet",
          accepted: ["greet", "say_hello", "welcome"],
          explanation: "Any valid function name works, such as greet, say_hello, or welcome."
        },
        {
          type: "mcq",
          lesson: "Lesson 3",
          prompt: "What is the purpose of TODO comments in scaffolded code?",
          options: [
            "They stop Python from running",
            "They mark unfinished work for the developer",
            "They create new files",
            "They only work in GitHub"
          ],
          answerIndex: 1,
          explanation: "TODO comments act as reminders of missing logic, helping developers complete tasks in order."
        },
        {
          type: "mcq",
          lesson: "Lesson 3",
          prompt: "Why should you test the script after each small change?",
          options: [
            "To hide bugs",
            "To catch errors early and isolate the last change",
            "To rename files",
            "To make code longer"
          ],
          answerIndex: 1,
          explanation: "Frequent testing makes debugging easier because the last change is usually the source of a new problem."
        },
        {
          type: "mcq",
          lesson: "Lesson 4",
          prompt: "Which structure is best for storing many values in order?",
          options: ["String", "List", "Dictionary", "Boolean"],
          answerIndex: 1,
          explanation: "Lists are ordered collections, making them ideal for sequences of values."
        },
        {
          type: "mcq",
          lesson: "Lesson 4",
          prompt: "What does a dictionary store?",
          options: [
            "Only integer values",
            "Key-value pairs",
            "Only text strings",
            "Only True/False values"
          ],
          answerIndex: 1,
          explanation: "Dictionaries store data as key-value pairs, such as {'name': 'Levani'}."
        },
        {
          type: "mcq",
          lesson: "Lesson 5",
          prompt: "What is the purpose of return inside a function?",
          options: [
            "To repeat the function",
            "To give a value back to the caller",
            "To delete the function",
            "To print the function name"
          ],
          answerIndex: 1,
          explanation: "return sends the produced result back to the place where the function was called."
        },
        {
          type: "free",
          lesson: "Lesson 5",
          prompt: "Write a valid function that accepts a name and returns a greeting string.",
          answer: "def greet(name): return f'Hello, {name}'",
          accepted: [
            "def greet(name): return f'Hello, {name}'",
            "def greet(name):\n    return f'Hello, {name}'",
            "def greet(name):\n    return f\"Hello, {name}\""
          ],
          explanation: "A valid function definition can accept a parameter and return a greeting built with an f-string."
        },
        {
          type: "mcq",
          lesson: "Lesson 6",
          prompt: "Which library is commonly used to make HTTP requests to an API in Python?",
          options: ["os", "json", "requests", "math"],
          answerIndex: 2,
          explanation: "The requests library is the standard tool used to send HTTP requests such as GET and POST."
        },
        {
          type: "mcq",
          lesson: "Lesson 6",
          prompt: "What does response.json() usually produce?",
          options: ["A file object", "A Python list or dictionary", "A screenshot", "A SQL query"],
          answerIndex: 1,
          explanation: "JSON responses are parsed into Python data structures such as dictionaries and lists."
        },
        {
          type: "mcq",
          lesson: "Lesson 6",
          prompt: "Why is a safe_get helper useful when reading nested API data?",
          options: [
            "It encrypts responses",
            "It prevents crashes when keys are missing",
            "It formats the terminal",
            "It stores the API key"
          ],
          answerIndex: 1,
          explanation: "safe_get checks nested dictionary keys before accessing them, reducing errors when data is missing or incomplete."
        },
        {
          type: "mcq",
          lesson: "Lesson 7",
          prompt: "What is a Telegram bot in the context of this course?",
          options: [
            "A browser tab",
            "A program that waits for messages and reacts to them",
            "A JSON file",
            "A database engine"
          ],
          answerIndex: 1,
          explanation: "A Telegram bot is a program that receives Telegram updates and responds through the Bot API."
        },
        {
          type: "mcq",
          lesson: "Lesson 7",
          prompt: "Who provides the token that authenticates the bot?",
          options: ["GitHub", "BotFather", "SQL", "VS Code"],
          answerIndex: 1,
          explanation: "BotFather creates and manages Telegram bot tokens."
        },
        {
          type: "mcq",
          lesson: "Lesson 7",
          prompt: "Why is offset important when polling updates?",
          options: [
            "It increases the speed of the internet",
            "It prevents reprocessing old messages",
            "It creates handlers",
            "It deletes the token"
          ],
          answerIndex: 1,
          explanation: "offset tells Telegram which update IDs have already been processed, so older messages are not repeated."
        },
        {
          type: "mcq",
          lesson: "Lesson 7",
          prompt: "Why do async handlers use await?",
          options: [
            "To stop the program immediately",
            "To wait for an operation such as a Telegram response before continuing",
            "To create a loop",
            "To print a dictionary"
          ],
          answerIndex: 1,
          explanation: "await pauses the handler until the awaited task completes, allowing the bot to continue cleanly."
        },
        {
          type: "free",
          lesson: "Lesson 7",
          prompt: "Write the command used to install the Telegram bot library with pip.",
          answer: "pip install python-telegram-bot",
          accepted: ["pip install python-telegram-bot", "pip install python-telegram-bot python-dotenv requests"],
          explanation: "The core library is python-telegram-bot, and in the course it was often installed together with python-dotenv and requests."
        },
        {
          type: "mcq",
          lesson: "Cross-topic",
          prompt: "Which combination is the best practice for API-based projects?",
          options: [
            "Hard-code secrets in code and push to GitHub",
            "Store secrets in a .env file and ignore it in Git",
            "Delete the API key after every request",
            "Use a browser as a backend"
          ],
          answerIndex: 1,
          explanation: "Secrets should never be committed to GitHub. .env files are used to keep credentials secure while still being accessible to the app."
        },
        {
          type: "mcq",
          lesson: "Cross-topic",
          prompt: "Which sequence best describes the learning flow from these lessons?",
          options: [
            "API design → loops → GitHub → bot design",
            "Python basics → functions → collections → API work → bot logic",
            "Database only → CSS only → JavaScript only",
            "Loops → binary → cloud → AI"
          ],
          answerIndex: 1,
          explanation: "The course moves from Python fundamentals to structured programming, data handling, API work, and then Telegram bot logic."
        },
        {
          type: "free",
          lesson: "Cross-topic",
          prompt: "Name one reason why testing a script after each small change is helpful.",
          answer: "it helps find bugs early",
          accepted: ["it helps find bugs early", "to catch errors quickly", "to isolate the last change", "to see where the bug was introduced"],
          explanation: "Small, frequent testing makes errors easier to localize and fix before they grow larger."
        }
      ];

      const quizRoot = document.getElementById("questions");
      const scoreDisplay = document.getElementById("score");
      const answeredDisplay = document.getElementById("answeredCount");
      const correctDisplay = document.getElementById("correctCount");
      const percentDisplay = document.getElementById("percentCount");
      const progressBar = document.getElementById("progressBar");
      const showAllBtn = document.getElementById("showAll");
      const resetBtn = document.getElementById("resetQuiz");

      const state = questions.map(() => ({ answered: false, correct: false, selected: null }));
      let score = 0;

      function normalize(value) {
        return String(value).trim().toLowerCase().replace(/\s+/g, " ");
      }

      function updateMetrics() {
        const answered = state.filter(item => item.answered).length;
        const correct = state.filter(item => item.correct).length;
        const percent = Math.round((score / questions.length) * 100);

        answeredDisplay.textContent = answered;
        correctDisplay.textContent = correct;
        percentDisplay.textContent = percent + "%";
        progressBar.style.width = (answered / questions.length * 100) + "%";
        scoreDisplay.textContent = `Score: ${score} / ${questions.length}`;
      }

      function revealAllAnswers() {
        document.querySelectorAll("details").forEach((detail) => detail.open = true);
      }

      function renderQuestions() {
        quizRoot.innerHTML = "";

        questions.forEach((q, index) => {
          const section = document.createElement("section");
          section.className = "waypoint";

          const num = document.createElement("span");
          num.className = "stamp-num";
          num.textContent = index + 1;

          const box = document.createElement("div");
          box.innerHTML = `
            <div class="question-head">
              <span class="question-label">${q.lesson}</span>
              <span class="question-label">${q.type === "mcq" ? "MCQ" : q.type === "code" ? "Code" : "Short answer"}</span>
            </div>
            <p class="question-text">${index + 1}. ${q.prompt}</p>
          `;

          if (q.type === "mcq") {
            const optionWrap = document.createElement("div");
            optionWrap.className = "options";

            q.options.forEach((option, optionIndex) => {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = "option-btn";
              btn.textContent = option;

              if (state[index].selected === optionIndex) {
                btn.classList.add("selected");
              }

              btn.addEventListener("click", () => {
                if (state[index].answered) return;
                state[index].answered = true;
                state[index].selected = optionIndex;
                const isCorrect = optionIndex === q.answerIndex;
                state[index].correct = isCorrect;

                if (isCorrect) score += 1;

                updateMetrics();

                Array.from(optionWrap.children).forEach((childButton, childIdx) => {
                  childButton.disabled = true;
                  childButton.classList.remove("selected");
                  if (childIdx === q.answerIndex) childButton.classList.add("correct");
                  if (childIdx === optionIndex && childIdx !== q.answerIndex) childButton.classList.add("wrong");
                });

                const spoiler = section.querySelector("details");
                spoiler.open = true;
              });

              optionWrap.appendChild(btn);
            });

            box.appendChild(optionWrap);
          } else {
            if (q.code) {
              const pre = document.createElement("pre");
              pre.className = "code-block";
              pre.textContent = q.code;
              box.appendChild(pre);
            }

            const inputWrap = document.createElement("div");
            inputWrap.className = "input-wrap";

            const input = document.createElement("input");
            input.type = "text";
            input.placeholder = "Type your answer...";
            input.autocomplete = "off";

            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "check-btn";
            btn.textContent = "Check";

            const feedback = document.createElement("div");
            feedback.className = "feedback";

            btn.addEventListener("click", () => {
              if (state[index].answered) return;

              const userValue = normalize(input.value);
              const accepted = (q.accepted || [q.answer]).map(normalize);
              const isCorrect = accepted.includes(userValue) || normalize(q.answer) === userValue;

              state[index].answered = true;
              state[index].correct = isCorrect;
              state[index].selected = userValue;

              if (isCorrect) score += 1;

              feedback.textContent = isCorrect ? "Correct!" : `Not quite — the best answer is: ${q.answer}`;
              feedback.classList.remove("correct", "wrong");
              feedback.classList.add(isCorrect ? "correct" : "wrong");
              feedback.style.display = "block";

              updateMetrics();

              const spoiler = section.querySelector("details");
              spoiler.open = true;
            });

            inputWrap.appendChild(input);
            inputWrap.appendChild(btn);
            box.appendChild(inputWrap);
            box.appendChild(feedback);
          }

          const details = document.createElement("details");
          const summary = document.createElement("summary");
          summary.textContent = "Show correct answer";
          const answerBox = document.createElement("div");
          answerBox.className = "answer-box";
          answerBox.innerHTML = `<strong>Correct answer:</strong> ${q.type === "mcq" ? q.options[q.answerIndex] : q.answer}<br><br>${q.explanation}`;
          details.append(summary, answerBox);

          section.appendChild(num);
          section.appendChild(box);
          section.appendChild(details);
          quizRoot.appendChild(section);
        });
      }

      function resetQuiz() {
        state.forEach((s) => {
          s.answered = false;
          s.correct = false;
          s.selected = null;
        });
        score = 0;
        updateMetrics();

        document.querySelectorAll(".option-btn").forEach((btn) => {
          btn.disabled = false;
          btn.classList.remove("correct", "wrong", "selected");
        });

        document.querySelectorAll("input[type='text']").forEach((input) => {
          input.value = "";
        });

        document.querySelectorAll(".feedback").forEach((feedback) => {
          feedback.style.display = "none";
          feedback.textContent = "";
          feedback.classList.remove("correct", "wrong");
        });

        document.querySelectorAll("details").forEach((detail) => {
          detail.open = false;
        });

        renderQuestions();
        updateMetrics();
      }

      showAllBtn.addEventListener("click", revealAllAnswers);
      resetBtn.addEventListener("click", resetQuiz);

      renderQuestions();
      updateMetrics();
    </script>
  </body>
</html>
